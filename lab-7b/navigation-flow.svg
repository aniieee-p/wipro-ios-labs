<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <rect width="900" height="250" rx="18" fill="#f7f8fc"/>
  <rect x="55" y="74" width="210" height="96" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111">Course List</text>
  <text x="160" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">UITableView + reusable cell</text>
  <rect x="630" y="74" width="215" height="96" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="737" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111">Course Detail</text>
  <text x="737" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Receives selected Course</text>
  <line x1="266" y1="110" x2="620" y2="110" stroke="#444" stroke-width="3"/>
  <polygon points="620,110 605,101 605,119" fill="#444"/>
  <text x="443" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">select row → push(detail(course:))</text>
  <line x1="630" y1="147" x2="276" y2="147" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
  <polygon points="276,147 291,138 291,156" fill="#777"/>
  <text x="448" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Back button → pop to list</text>
  <text x="450" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">Both screens are children of the UINavigationController stack.</text>
</svg>
