<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">Lab 8B navigation flow</title>
  <desc id="description">Course list navigates to a selected course detail or the About screen. Back returns to the prior screen; Courses returns to the list.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#53627a"/>
    </marker>
    <style>
      .box { fill: #f4f6fb; stroke: #596b91; stroke-width: 2; rx: 16; }
      .title { font: 600 18px -apple-system, BlinkMacSystemFont, sans-serif; fill: #182238; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; fill: #39465f; }
      .edge { stroke: #53627a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #39465f; }
    </style>
  </defs>
  <rect x="30" y="95" width="220" height="110" class="box"/>
  <text x="140" y="132" text-anchor="middle" class="title">Course List</text>
  <text x="140" y="158" text-anchor="middle" class="body">NavigationStack root</text>
  <text x="140" y="181" text-anchor="middle" class="body">Course links + info action</text>

  <rect x="340" y="35" width="230" height="110" class="box"/>
  <text x="455" y="72" text-anchor="middle" class="title">Course Detail</text>
  <text x="455" y="98" text-anchor="middle" class="body">Receives selected Course</text>
  <text x="455" y="121" text-anchor="middle" class="body">Back or Courses to return</text>

  <rect x="650" y="155" width="220" height="110" class="box"/>
  <text x="760" y="192" text-anchor="middle" class="title">About Navigation</text>
  <text x="760" y="218" text-anchor="middle" class="body">Pushed by info toolbar</text>
  <text x="760" y="241" text-anchor="middle" class="body">Back pops to the list</text>

  <path d="M250 115 C285 85, 305 75, 340 78" class="edge"/>
  <text x="294" y="70" text-anchor="middle" class="label">Select course</text>
  <path d="M250 185 C410 275, 535 270, 650 225" class="edge"/>
  <text x="444" y="267" text-anchor="middle" class="label">Info action</text>
  <path d="M340 130 C305 160, 285 170, 250 170" class="edge"/>
  <text x="296" y="159" text-anchor="middle" class="label">Back / Courses</text>
  <path d="M650 180 C520 20, 380 20, 250 110" class="edge"/>
  <text x="470" y="30" text-anchor="middle" class="label">Back</text>
</svg>
