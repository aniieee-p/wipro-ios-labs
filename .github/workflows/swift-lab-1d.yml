
name: Lab 1D Swift Optionals Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'lab-1d/**'
      - '.github/workflows/swift-lab-1d.yml'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Compile Swift project
        run: swiftc lab-1d/main.swift -o lab-1d/lab-1d

      - name: Run Swift project
        run: ./lab-1d/lab-1d
