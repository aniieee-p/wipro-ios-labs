name: Lab 2C Swift Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'lab-2c/**'
      - '.github/workflows/swift-lab-2c.yml'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Compile Swift project
        run: swiftc lab-2c/main.swift -o lab-2c/lab-2c

      - name: Run Swift project
        run: ./lab-2c/lab-2c