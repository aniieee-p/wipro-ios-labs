
name: Lab 2B Swift Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'lab-2b/**'
      - '.github/workflows/swift-lab-2b.yml'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Compile Swift project
        run: swiftc lab-2b/main.swift -o lab-2b/lab-2b

      - name: Run Swift project
        run: ./lab-2b/lab-2b

