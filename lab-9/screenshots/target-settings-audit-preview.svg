<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Xcode target settings audit preview</title>
  <desc id="description">A documentation mockup of audited Lab7A target settings: app target, example bundle ID, version, iOS 16 deployment, automatic signing, and portrait orientation. Not a screenshot from Xcode.</desc>
  <rect width="920" height="620" rx="22" fill="#edf0f5"/>
  <rect x="15" y="15" width="890" height="590" rx="16" fill="#ffffff" stroke="#cbd2df"/>
  <rect x="15" y="15" width="890" height="48" rx="16" fill="#f7f8fb"/>
  <circle cx="39" cy="39" r="6" fill="#e37772"/>
  <circle cx="60" cy="39" r="6" fill="#e4bd5f"/>
  <circle cx="81" cy="39" r="6" fill="#77b77b"/>
  <text x="112" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#252a35">Lab7A · Target: Lab7A · General</text>
  <rect x="35" y="83" width="198" height="485" rx="10" fill="#f7f8fb"/>
  <text x="55" y="117" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#323a4a">TARGET</text>
  <rect x="48" y="132" width="172" height="38" rx="7" fill="#dce8ff"/>
  <text x="68" y="157" font-family="Arial, sans-serif" font-size="14" fill="#244a96">▣ Lab7A</text>
  <text x="55" y="203" font-family="Arial, sans-serif" font-size="12" fill="#656d7b">PROJECT</text>
  <text x="68" y="230" font-family="Arial, sans-serif" font-size="13" fill="#3c4350">Lab7A</text>
  <text x="260" y="111" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#252a35">Identity and Deployment</text>
  <g font-family="Arial, sans-serif">
    <text x="260" y="155" font-size="13" fill="#5f6775">Product</text>
    <text x="482" y="155" font-size="13" fill="#272d38">Lab7A.app · Application target</text>
    <line x1="260" y1="168" x2="870" y2="168" stroke="#e1e4ea"/>
    <text x="260" y="200" font-size="13" fill="#5f6775">Bundle Identifier</text>
    <text x="482" y="200" font-size="13" fill="#272d38">com.example.wipro.lab7a</text>
    <text x="482" y="219" font-size="11" fill="#a45727">Example identifier — replace before distribution</text>
    <line x1="260" y1="232" x2="870" y2="232" stroke="#e1e4ea"/>
    <text x="260" y="264" font-size="13" fill="#5f6775">Version</text>
    <text x="482" y="264" font-size="13" fill="#272d38">1.0</text>
    <line x1="260" y1="277" x2="870" y2="277" stroke="#e1e4ea"/>
    <text x="260" y="309" font-size="13" fill="#5f6775">Build</text>
    <text x="482" y="309" font-size="13" fill="#272d38">1</text>
    <line x1="260" y1="322" x2="870" y2="322" stroke="#e1e4ea"/>
    <text x="260" y="354" font-size="13" fill="#5f6775">iOS Deployment Target</text>
    <text x="482" y="354" font-size="13" fill="#272d38">iOS 16.0</text>
    <line x1="260" y1="367" x2="870" y2="367" stroke="#e1e4ea"/>
    <text x="260" y="399" font-size="13" fill="#5f6775">Signing Style</text>
    <text x="482" y="399" font-size="13" fill="#272d38">Automatic · Team not specified in project file</text>
    <line x1="260" y1="412" x2="870" y2="412" stroke="#e1e4ea"/>
    <text x="260" y="444" font-size="13" fill="#5f6775">Supported Platforms</text>
    <text x="482" y="444" font-size="13" fill="#272d38">iOS device + iOS Simulator</text>
    <line x1="260" y1="457" x2="870" y2="457" stroke="#e1e4ea"/>
    <text x="260" y="489" font-size="13" fill="#5f6775">Orientation / Privacy</text>
    <text x="482" y="489" font-size="13" fill="#272d38">Portrait only · No privacy usage strings</text>
    <rect x="260" y="523" width="610" height="31" rx="6" fill="#fff3db"/>
    <text x="275" y="544" font-size="11" fill="#754b19">ILLUSTRATIVE AUDIT SUMMARY · NOT A CAPTURE FROM XCODE</text>
  </g>
</svg>
